[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediavocab"
dynamic = ["version"]
description = "Reference vocabulary and pydantic data model for media cataloguing."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
keywords = ["media", "metadata", "taxonomy", "pydantic", "vocabulary"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia",
]
dependencies = [
    "pydantic>=2",
    "ovos-spec-tools>=0.6.0a1",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/JarbasAi/mediavocab"

[tool.setuptools.dynamic]
version = {attr = "mediavocab.version.__version__"}

[tool.setuptools.packages.find]
include = ["mediavocab*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
"mediavocab.locale" = ["**/*.voc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
